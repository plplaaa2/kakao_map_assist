search_places:
  name: 장소 검색
  description: 장소명 또는 주소로 카카오맵 장소 후보를 검색하고 기본 정보를 반환합니다. 둘 중 하나 이상을 입력하세요.
  fields:
    name:
      name: 장소명
      description: 검색할 장소 또는 업체 이름입니다.
      example: 스타벅스
      selector:
        text:
    address:
      name: 주소 또는 지역
      description: 장소 검색에 함께 사용할 주소나 지역명입니다. 주소 좌표 변환 전용 기능은 아닙니다.
      example: 서울 강남구
      selector:
        text:
    limit:
      name: 최대 결과 수
      description: 한 번에 반환할 장소 수입니다.
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: box
geocode_address:
  name: 주소 조회
  description: 도로명 또는 지번 주소로 좌표와 주소 후보를 조회합니다. 장소명·업체명은 장소 검색을 사용하세요.
  fields:
    query:
      name: 도로명 또는 지번 주소
      required: true
      example: 서울 중구 세종대로 110
      selector:
        text:
    limit:
      name: 최대 결과 수
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: box
search_nearby:
  name: 주변 장소 검색
  description: 중심 좌표의 반경 안에서 가까운 순으로 검색합니다. 키워드 또는 카테고리 하나만 입력하세요. 거리는 도보 이동 거리가 아닙니다.
  fields:
    latitude:
      name: 중심 위도
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: 중심 경도
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    query:
      name: 검색 키워드
      description: 카테고리를 지정하지 않을 때 입력합니다.
      example: 스타벅스
      selector:
        text:
    category:
      name: 카테고리
      description: 검색 키워드를 지정하지 않을 때 선택합니다.
      selector:
        select:
          options:
            - {label: 대형마트, value: MT1}
            - {label: 편의점, value: CS2}
            - {label: '어린이집·유치원', value: PS3}
            - {label: 학교, value: SC4}
            - {label: 학원, value: AC5}
            - {label: 주차장, value: PK6}
            - {label: '주유소·충전소', value: OL7}
            - {label: 지하철역, value: SW8}
            - {label: 은행, value: BK9}
            - {label: 문화시설, value: CT1}
            - {label: 중개업소, value: AG2}
            - {label: 공공기관, value: PO3}
            - {label: 관광명소, value: AT4}
            - {label: 숙박, value: AD5}
            - {label: 음식점, value: FD6}
            - {label: 카페, value: CE7}
            - {label: 병원, value: HP8}
            - {label: 약국, value: PM9}
    radius:
      name: 검색 반경 (m)
      default: 1000
      selector:
        number:
          min: 1
          max: 20000
          mode: box
    limit:
      name: 최대 결과 수
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: box
get_route:
  name: 경로 조회
  description: 출발·도착 좌표로 대중교통, 도보, 자전거 또는 자동차 경로를 조회합니다. 기본은 대중교통이며 자동차는 추천 경로가 기본입니다.
  fields:
    start_latitude:
      name: 출발지 위도
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    start_longitude:
      name: 출발지 경도
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    end_latitude:
      name: 도착지 위도
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    end_longitude:
      name: 도착지 경도
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    mode:
      name: 이동 수단
      default: public_transport
      selector:
        select:
          options:
            - label: 대중교통
              value: public_transport
            - label: 도보
              value: walk
            - label: 자전거
              value: bicycle
            - label: 자동차
              value: car
    start_name:
      name: 출발지 이름
      default: 출발
      selector:
        text:
    end_name:
      name: 도착지 이름
      default: 도착
      selector:
        text:
    priority:
      name: 자동차 경로 기준
      description: 자동차에서만 사용합니다. 별도 요청이 없으면 추천 경로입니다.
      default: RECOMMEND
      selector:
        select:
          options:
            - {label: 추천, value: RECOMMEND}
            - {label: 최단 시간, value: TIME}
            - {label: 최단 거리, value: DISTANCE}
    avoid:
      name: 자동차 회피 옵션
      description: 자동차에서만 사용합니다. 지정하지 않으면 회피 조건을 추가하지 않습니다.
      selector:
        select:
          multiple: true
          options:
            - {label: 유료도로, value: toll}
            - {label: 자동차 전용도로, value: motorway}
            - {label: 페리, value: ferries}
            - {label: 어린이 보호구역, value: schoolzone}
            - {label: 유턴, value: uturn}
